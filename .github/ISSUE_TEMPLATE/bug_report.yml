name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: AI Bridge Version
      description: "Run `ai-bridge --version` to find this."
      placeholder: "1.0.9"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux (X11)
        - Linux (Wayland)
        - WSL2
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Which command?
      options:
        - ai-bridge init
        - ai-bridge pack
        - ai-bridge apply
        - ai-bridge apply --paste
        - ai-bridge apply --watch
        - ai-bridge update
        - ai-bridge index status
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I run `ai-bridge apply --paste`, it fails with..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `ai-bridge init`
        2. Run `ai-bridge pack`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      description: Paste any error messages or terminal output.
      render: shell
    validations:
      required: false
