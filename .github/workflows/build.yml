name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Notes/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Notes/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ai-bridge.slnx

      - name: Build
        run: dotnet build ai-bridge.slnx --no-restore /p:TreatWarningsAsErrors=true
