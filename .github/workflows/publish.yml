name: Publish Native Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            asset_name: ai-bridge-win-x64.zip
            binary: ai-bridge.exe
          - rid: linux-x64
            os: ubuntu-latest
            asset_name: ai-bridge-linux-x64.tar.gz
            binary: ai-bridge
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            asset_name: ai-bridge-linux-arm64.tar.gz
            binary: ai-bridge
          # macos-13 runners have been retired (jobs wait forever). Native AOT can
          # cross-compile between macOS x64 and arm64, so the Intel build runs on
          # the Apple Silicon runner.
          - rid: osx-x64
            os: macos-latest
            asset_name: ai-bridge-osx-x64.tar.gz
            binary: ai-bridge
          - rid: osx-arm64
            os: macos-latest
            asset_name: ai-bridge-osx-arm64.tar.gz
            binary: ai-bridge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The git tag is the only source of the version: tag v1.2.3 builds version 1.2.3.
      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' must look like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT binary
        run: >
          dotnet publish src/AIBridge.Cli/AIBridge.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:SelfContained=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      # Windows ships a .zip (PowerShell can extract it natively).
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/${{ matrix.rid }}/${{ matrix.binary }} -DestinationPath ${{ matrix.asset_name }}
        shell: pwsh

      # Linux and macOS ship a .tar.gz — tar is available everywhere, unzip is not.
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset_name }} -C publish/${{ matrix.rid }} ${{ matrix.binary }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nuget:
    name: NuGet package
    needs: build
    # Pre-releases are never published to NuGet.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets this job get a short-lived NuGet key (Trusted Publishing)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' must look like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # A dotnet tool is a normal framework-dependent package, so AOT is switched off here.
      - name: Pack dotnet tool
        run: >
          dotnet pack src/AIBridge.Cli/AIBridge.Cli.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishAot=false
          -p:SelfContained=false
          -o nupkg

      # The temporary NuGet key is valid for 1 hour, so log in right before pushing.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: arpanvgm

      - name: NuGet push
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
